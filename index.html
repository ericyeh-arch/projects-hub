<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eric 專案入口</title>
<style>
  :root { --bg:#f3f6fb; --card:#fff; --text:#1f2937; --muted:#64748b; --accent:#2563eb; --line:#e2e8f0; --chip:#e8effc; --err:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --text:#e5e7eb; --muted:#94a3b8; --accent:#60a5fa; --line:#334155; --chip:#25324a; --err:#f87171; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Noto Sans TC",sans-serif; background:var(--bg); color:var(--text); }
  [hidden] { display:none !important; }

  /* 登入 */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .auth-card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  .auth-card h1 { margin:0 0 4px; font-size:1.4rem; }
  .auth-card p { margin:0 0 18px; color:var(--muted); font-size:.92rem; }
  .auth-card label { display:block; font-size:.88rem; margin:12px 0 4px; }
  .auth-card input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  .auth-card button { width:100%; margin-top:18px; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  .auth-card button:disabled { opacity:.6; cursor:wait; }
  #err { color:var(--err); font-size:.88rem; min-height:1.2em; margin-top:10px; }

  /* 專案頁 */
  header { max-width:1100px; margin:0 auto; padding:32px 16px 8px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1.main { margin:0 0 4px; font-size:1.8rem; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .who { font-size:.85rem; color:var(--muted); text-align:right; }
  .who button { margin-left:8px; padding:5px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #q { flex:1 1 240px; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  .chip { padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { max-width:1100px; margin:0 auto; padding:8px 16px 48px; }
  h2 { font-size:1.1rem; margin:28px 0 12px; color:var(--muted); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .card h3 { margin:0; font-size:1.05rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .card p { margin:0; color:var(--muted); font-size:.9rem; flex:1; }
  .repo { font-size:.78rem; color:var(--muted); word-break:break-all; }
  .links { display:flex; gap:8px; margin-top:4px; }
  .links a { padding:6px 12px; border-radius:8px; font-size:.88rem; text-decoration:none; border:1px solid var(--line); color:var(--text); }
  .links a.open { background:var(--accent); border-color:var(--accent); color:#fff; }
  .badge { font-size:.72rem; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--muted); }
  #empty { text-align:center; color:var(--muted); padding:40px 16px; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:0 16px 32px; }
</style>
</head>
<body>

<!-- 登入畫面 -->
<section id="login" hidden>
  <form class="auth-card" id="form">
    <h1>🔐 專案入口</h1>
    <p>請先登入以檢視專案清單</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">密碼</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <div id="err" role="alert"></div>
    <button id="submit" type="submit">登入</button>
  </form>
</section>

<!-- 專案頁（登入後） -->
<div id="app" hidden>
  <header>
    <div class="top">
      <div>
        <h1 class="main">🗂️ Eric 專案入口</h1>
        <p class="sub">整合所有 GitHub Pages 網頁，共 <span id="count">0</span> 個</p>
      </div>
      <div class="who"><span id="me"></span><button id="logout" type="button">登出</button></div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="搜尋名稱、說明或 repo…" aria-label="搜尋">
      <span id="chips"></span>
    </div>
  </header>
  <main id="main"></main>
  <div id="empty" hidden></div>
  <footer>資料存放於 Supabase，需登入且在白名單內才可讀取</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const USER = "ericyeh-arch";
const BASE = `https://${USER}.github.io`;
// Publishable key 可公開；實際權限由 Supabase 的 RLS 控制
const sb = supabase.createClient(
  "https://pjuamlegodbroyfxsmeu.supabase.co",
  "sb_publishable_E_6_X28Ox302eAf0i8wW2w_2fcWg1Xp"
);

const $ = id => document.getElementById(id);
let PROJECTS = [], cats = ["全部"], activeCat = "全部";

const url = p => p.repo ? `${BASE}/${p.repo}/` : `${BASE}/`;
const src = p => `https://github.com/${USER}/${p.repo || USER + ".github.io"}`;

/* ---------- 畫面切換 ---------- */
function showLogin() { $("app").hidden = true; $("login").hidden = false; $("pass").value = ""; }
function showApp()   { $("login").hidden = true; $("app").hidden = false; }

/* ---------- 讀取專案 ---------- */
async function loadProjects(session) {
  showApp();
  $("me").textContent = session.user.email;
  const { data, error } = await sb.from("projects").select("*").order("sort");
  const empty = $("empty");
  if (error) { empty.hidden = false; empty.textContent = "讀取失敗：" + error.message; return; }
  if (!data.length) {
    empty.hidden = false;
    empty.textContent = "此帳號沒有權限檢視專案清單（不在白名單內）。";
    $("main").replaceChildren(); $("count").textContent = 0; return;
  }
  empty.hidden = true;
  PROJECTS = data;
  cats = ["全部", ...new Set(data.map(p => p.cat))];
  $("count").textContent = data.length;
  buildChips(); render();
}

function buildChips() {
  const chips = $("chips"); chips.replaceChildren();
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c; b.dataset.cat = c;
    b.setAttribute("aria-pressed", c === activeCat);
    b.onclick = () => { activeCat = c; chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.cat === c)); render(); };
    chips.append(b);
  });
}

function card(p) {
  const el = document.createElement("article"); el.className = "card";
  const h = document.createElement("h3"); h.textContent = `${p.icon || ""} ${p.name}`;
  if (p.badge) { const s = document.createElement("span"); s.className = "badge"; s.textContent = p.badge; h.append(s); }
  const d = document.createElement("p"); d.textContent = p.description || "";
  const r = document.createElement("div"); r.className = "repo"; r.textContent = url(p).replace("https://", "");
  const l = document.createElement("div"); l.className = "links";
  l.append(
    Object.assign(document.createElement("a"), { href:url(p), target:"_blank", rel:"noopener", className:"open", textContent:"開啟網頁" }),
    Object.assign(document.createElement("a"), { href:src(p), target:"_blank", rel:"noopener", textContent:"原始碼" })
  );
  el.append(h, d, r, l);
  return el;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const main = $("main"); main.replaceChildren();
  let shown = 0;
  for (const c of cats.slice(1)) {
    if (activeCat !== "全部" && activeCat !== c) continue;
    const items = PROJECTS.filter(p => p.cat === c &&
      (!q || [p.name, p.description, p.repo, p.cat].join(" ").toLowerCase().includes(q)));
    if (!items.length) continue;
    const h = document.createElement("h2"); h.textContent = `${c}（${items.length}）`;
    const g = document.createElement("div"); g.className = "grid";
    items.forEach(p => g.append(card(p)));
    main.append(h, g); shown += items.length;
  }
  const empty = $("empty");
  empty.hidden = shown > 0;
  if (!shown) empty.textContent = "找不到符合的專案";
}
$("q").addEventListener("input", render);

/* ---------- 登入 / 登出 ---------- */
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = ""; $("submit").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  $("submit").disabled = false;
  if (error) { $("err").textContent = "登入失敗：Email 或密碼不正確"; $("pass").select(); }
  // 成功時由 onAuthStateChange 切換畫面
});
$("logout").addEventListener("click", () => sb.auth.signOut());

sb.auth.onAuthStateChange((event, session) => {
  if (session) setTimeout(() => loadProjects(session), 0);
  else { PROJECTS = []; showLogin(); }
});
sb.auth.getSession().then(({ data }) => { if (!data.session) showLogin(); });
</script>
</body>
</html>
